# SPA + реверс-прокси. Шаблон: при старте образ подставляет ${NGINX_LOCAL_RESOLVERS} —
# DNS из /etc/resolv.conf контейнера (NGINX_ENTRYPOINT_LOCAL_RESOLVERS в Dockerfile).
# В Docker это 127.0.0.11, в Podman — адрес aardvark-dns; жёстко прописанный
# 127.0.0.11 в Podman не работал.
#
# Переменная в proxy_pass, а не имя напрямую: так nginx ищет "api" при запросе,
# а не при старте. Иначе фронт без живого api не поднимается вовсе (smoke-тест
# образа в CI, рестарт api раньше фронта), а --scale api=N не даёт round-robin.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Во фрейме имеет право открываться только виджет — он для этого и сделан. Всё
# остальное фреймиться не должно, и в первую очередь /admin и /operator: чужая
# страница может накрыть интерфейс прозрачным слоем и собрать клики
# администратора по своим кнопкам.
#
# Решение принимается по $request_uri, а не отдельным location, именно из-за
# SPA: все маршруты обслуживает try_files с внутренним редиректом на
# /index.html, и заголовки в итоге берутся из блока этого файла — location
# /widget до ответа не доживает. $request_uri, в отличие от $uri, хранит
# исходный адрес запроса и переживает внутренний редирект.
map $request_uri $frame_policy {
    default      "frame-ancestors 'none'";
    "~^/widget"  "frame-ancestors *";     # сюда же дописываются конкретные домены
}

# X-Frame-Options умеет только «можно» и «нельзя» и не умеет «кому», поэтому для
# виджета он не выставляется вовсе: пустое значение nginx не добавляет.
map $request_uri $frame_legacy {
    default      "DENY";
    "~^/widget"  "";
}

# В лог пишем путь без query-строки. Токен доступа туда попадать не должен: у
# сокета его иначе не передать (браузерный WebSocket не умеет свои заголовки),
# и он оседал в access.log открытым текстом — а это готовые права на двенадцать
# часов для любого, кто читает логи. Директива объявляется здесь, а не в server:
# внутри server nginx её не принимает и падает при старте.
log_format noquery '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

server {
    # 8080, а не 80: nginx работает без root (образ nginx-unprivileged).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # text/csv — выгрузки диалогов и базы знаний: они уходили несжатыми, хотя
    # рядом лежащий export.json жался нормально. На реальных данных разница
    # пятикратная (повторяющиеся id, статусы и даты жмутся отлично).
    gzip_types text/css application/javascript application/json image/svg+xml text/csv text/plain;
    gzip_min_length 1024;
    # Без этой строки не сжимался ВЕСЬ ответ бэкенда: gzip_proxied по умолчанию
    # off, то есть проксированные ответы nginx не трогает вовсе. Статика с диска
    # жалась и без неё — отсюда и создавалось впечатление, что gzip настроен.
    gzip_proxied any;
    gzip_vary on;

    access_log /var/log/nginx/access.log noquery;

    # add_header в location заменяет унаследованные целиком, поэтому там, где
    # свои заголовки уже есть, эти две строки продублированы.
    add_header Content-Security-Policy $frame_policy always;
    add_header X-Frame-Options $frame_legacy always;

    set $backend http://api:8000;

    # Host во всех проксируемых location — $http_host (имя вместе с портом), а не
    # $host (имя без порта). API сверяет с Host заголовок Origin у сокета
    # оператора и строит из него абсолютные адреса (редиректы). Со стенда на
    # нестандартном порту браузер шлёт Origin http://localhost:8090, а с $host
    # api видел Host: localhost — и закрывал сокет оператора с 4403: своё
    # сообщение не появлялось в ленте, очередь не обновлялась. На 443/80 порт в
    # Host не пишется, поэтому на боевом https ошибка не проявлялась.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        # Методички приходят файлами на десятки мегабайт, аудио голосового ввода —
        # тоже не текст. Стандартный лимит nginx в 1 МБ рубит и то, и другое.
        # Значение — потолок тела запроса у самого API (MAX_REQUEST_BYTES в
        # app/uploads.py: документ до 128 МБ плюс обвязка multipart). Меньше —
        # и nginx отвечает своей HTML-страницей 413 раньше, чем запрос доходит
        # до понятной проверки в коде. Совпадение чисел сверяет test_uploads.py.
        client_max_body_size 130m;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        # Реальный адрес клиента: по нему считается лимит частоты сообщений,
        # и без этих заголовков все посетители выглядели бы одним клиентом
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /dbadmin {
        proxy_pass $backend;
        # SQLAdmin отвечает АБСОЛЮТНЫМИ редиректами (/dbadmin -> /dbadmin/ ->
        # /dbadmin/login) и строит их из Host: с $host браузер со стенда на 8090
        # уезжал на http://localhost/dbadmin/, на 80-й порт, где ничего нет.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Метрики наружу не отдаются: счётчики по путям и кодам ответа — карта API
    # для постороннего. Prometheus ходит к api напрямую, по внутренней сети и с
    # METRICS_TOKEN.
    location /metrics {
        return 404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Файлы в /assets/ версионируются хешем в имени, а index.html и виджет — нет.
    # Без явного no-cache браузер кеширует их эвристически, и обновление фронта
    # доходит до пользователя только после ручного сброса кеша.
    # Сюда приходит любой маршрут SPA после try_files, поэтому политика фрейминга
    # обязана быть и здесь — своё значение она берёт из адреса исходного запроса.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy $frame_policy always;
        add_header X-Frame-Options $frame_legacy always;
    }

    location = /embed.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri /index.html;
    }
}
