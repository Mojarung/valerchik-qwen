<rect x="470" y="366" width="160" height="74" rx="10" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.6"/>
<text x="550" y="396" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">Уведомить о нарушении</text>
