<text x="970" y="279" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">Найти ответ в базе</text>
<text x="970" y="293" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">знаний: вектор + BM25</text>
<text x="970" y="307" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">+ RRF</text>
