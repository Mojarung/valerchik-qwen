<text x="2650" y="628" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">Вернуть обращение в</text>
<text x="2650" y="642" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">очередь</text>
<rect x="2780" y="488" width="160" height="74" rx="10" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.6"/>
<text x="2860" y="511" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">Получить подсказки из</text>
<text x="2860" y="525" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">базы знаний и черновик</text>
<text x="2860" y="539" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">ответа</text>
<rect x="2990" y="488" width="160" height="74" rx="10" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.6"/>
<text x="3070" y="525" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">Ответить пользователю</text>
