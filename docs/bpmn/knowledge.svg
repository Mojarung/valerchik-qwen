<rect x="680" y="146" width="160" height="74" rx="10" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.6"/>
<text x="760" y="176" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">Нарезать по заголовкам</text>
<text x="760" y="190" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">и абзацам</text>
