<rect x="1100" y="146" width="160" height="74" rx="10" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.6"/>
<text x="1180" y="176" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">Привязать иллюстрации</text>
<text x="1180" y="190" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">по авторской нумерации</text>
<rect x="1310" y="146" width="160" height="74" rx="10" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.6"/>
<text x="1390" y="176" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">Определить линию</text>
<text x="1390" y="190" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">поддержки и категорию</text>
<rect x="1520" y="146" width="160" height="74" rx="10" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.6"/>
<text x="1600" y="169" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">Проиндексировать:</text>
<text x="1600" y="183" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">blue/green через</text>
<text x="1600" y="197" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#1f2430">алиасы Qdrant</text>
<path d="M1810.0 158.0 L1835.0 183.0 L1810.0 208.0 L1785.0 183.0 z" fill="#f4b73f" stroke="#3c4048" stroke-width="1.6"/>
