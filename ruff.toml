# Линт для кода, который лежит вне backend/ и zakupki-mcp/ — у тех свои
# [tool.ruff] в pyproject.toml. Сюда попадают микросервисы-обёртки
# (stt/tts/docparse), внешний MCP-сервер и служебные скрипты: у них нет
# собственных зависимостей для разработки, поэтому конфиг один на всех.
# Правила те же, что в backend, только target-version ниже — эти сервисы
# собираются на python 3.12.
line-length = 110
target-version = "py312"

[lint]
# C90 и PLR09xx держат функции обозримыми: ветвлений, аргументов и строк не
# больше, чем помещается в голове; PLR2004 — пороги только именованными
# константами, чтобы у каждого числа было объяснение, откуда оно.
select = [
    "E", "F", "I", "UP", "B", "ASYNC", "BLE", "RUF100", "ANN201", "ANN205", "ANN206",
    "C90", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50

[lint.per-file-ignores]
# Тип возврата у теста — всегда None, а числа в assert — ожидаемые значения,
# а не пороги: ни то ни другое объявлять не нужно.
"**/test_*.py" = ["ANN", "PLR2004"]
